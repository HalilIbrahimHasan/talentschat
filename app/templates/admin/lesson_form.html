{% extends "base.html" %}

{% block title %}{% if lesson %}Edit Lesson{% else %}Create Lesson{% endif %}{% endblock %}

{% block content %}
<div class="min-h-screen bg-gradient-to-br from-indigo-50 via-purple-50 to-pink-50 py-8">
    <div class="max-w-3xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="bg-white rounded-2xl shadow-lg p-8">
            <h1 class="text-3xl font-bold text-gray-900 mb-2">
                {% if lesson %}Edit Lesson{% else %}Create Lesson{% endif %}
            </h1>
            <p class="text-gray-600 mb-6">Portal: <strong>{{ portal.name }}</strong></p>
            
            <form method="POST" class="space-y-6">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
                
                <div>
                    <label for="title" class="block text-sm font-semibold text-gray-700 mb-2">
                        Lesson Title <span class="text-red-500">*</span>
                    </label>
                    <input type="text" id="title" name="title" required
                           value="{{ lesson.title if lesson else '' }}"
                           class="w-full px-4 py-3 border-2 border-indigo-200 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500">
                </div>
                
                <div>
                    <label for="description" class="block text-sm font-semibold text-gray-700 mb-2">
                        Description
                    </label>
                    <textarea id="description" name="description" rows="4"
                              class="w-full px-4 py-3 border-2 border-indigo-200 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500">{{ lesson.description if lesson else '' }}</textarea>
                </div>
                
                <div>
                    <label for="youtube_url" class="block text-sm font-semibold text-gray-700 mb-2">
                        YouTube URL
                    </label>
                    <input type="url" id="youtube_url" name="youtube_url"
                           value="{{ lesson.youtube_url if lesson else '' }}"
                           placeholder="https://www.youtube.com/watch?v=... or https://youtu.be/..."
                           class="w-full px-4 py-3 border-2 border-indigo-200 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500">
                    <p class="text-sm text-gray-500 mt-1">Full YouTube URL (watch or share link)</p>
                </div>
                
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label for="points_complete" class="block text-sm font-semibold text-gray-700 mb-2">
                            Points (on completion)
                        </label>
                        <input type="number" id="points_complete" name="points_complete" min="0"
                               value="{{ lesson.points_complete if lesson else 10 }}"
                               class="w-full px-4 py-3 border-2 border-indigo-200 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500">
                    </div>
                    
                    <div>
                        <label for="order_index" class="block text-sm font-semibold text-gray-700 mb-2">
                            Order Index
                        </label>
                        <input type="number" id="order_index" name="order_index" min="0"
                               value="{{ lesson.order_index if lesson else 0 }}"
                               class="w-full px-4 py-3 border-2 border-indigo-200 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500">
                    </div>
                </div>
                
                <div class="flex space-x-4">
                    <button type="submit" 
                            class="flex-1 bg-gradient-to-r from-indigo-600 to-purple-600 text-white px-6 py-3 rounded-xl hover:shadow-lg transition font-semibold">
                        <i class="fas fa-save mr-2"></i> Save
                    </button>
                    <a href="{{ url_for('admin.portal_lessons', portal_id=portal.id) }}" 
                       class="bg-gray-200 text-gray-700 px-6 py-3 rounded-xl hover:bg-gray-300 transition font-semibold">
                        Cancel
                    </a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
