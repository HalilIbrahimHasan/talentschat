{% extends "base.html" %}

{% block title %}Create Channel - TalentsChat{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto px-4 sm:px-6 lg:px-8 py-12">
    <div class="text-center mb-10 animate-fadeInUp">
        <div class="text-6xl mb-4">#️⃣</div>
        <h1 class="text-4xl font-extrabold gradient-text mb-3">Create New Channel</h1>
        <p class="text-gray-600 text-lg">In {{ workspace.name }}</p>
    </div>
    
    <form method="POST" class="bg-gradient-to-br from-white to-purple-50 rounded-2xl shadow-2xl p-8 border-4 border-purple-200 animate-fadeInUp">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
        <div class="mb-6">
            <label for="name" class="block text-sm font-bold text-gray-800 mb-3 flex items-center">
                <i class="fas fa-hashtag mr-2 text-purple-600"></i>
                Channel Name <span class="text-red-500 ml-1">*</span>
            </label>
            <input type="text" name="name" id="name" required
                   class="w-full px-5 py-4 border-2 border-purple-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-purple-500 text-lg transition">
        </div>
        
        <div class="mb-6">
            <label class="flex items-center p-4 bg-gradient-to-r from-purple-50 to-indigo-50 rounded-xl border-2 border-purple-200 cursor-pointer hover:border-purple-400 transition">
                <input type="checkbox" name="is_private" class="h-5 w-5 text-purple-600 focus:ring-purple-500 border-gray-300 rounded">
                <span class="ml-3 text-base font-semibold text-gray-800">
                    <i class="fas fa-lock mr-2 text-purple-600"></i>Private channel
                </span>
            </label>
        </div>
        
        <div class="flex space-x-4 mt-8">
            <button type="submit" class="flex-1 bg-gradient-to-r from-purple-600 to-indigo-600 text-white px-8 py-4 rounded-xl hover:shadow-xl transform hover:scale-105 transition font-bold text-lg">
                <i class="fas fa-plus mr-2"></i> Create Channel
            </button>
            <a href="{{ url_for('workspaces.view', workspace_slug=workspace.slug) }}" class="bg-gradient-to-r from-gray-300 to-gray-400 text-gray-700 px-8 py-4 rounded-xl hover:shadow-lg transform hover:scale-105 transition font-semibold">
                Cancel
            </a>
        </div>
    </form>
</div>
{% endblock %}
