{% extends "base.html" %}

{% block title %}Create Workspace - TalentsChat{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto px-4 sm:px-6 lg:px-8 py-12">
    <div class="text-center mb-10 animate-fadeInUp">
        <div class="text-6xl mb-4">🚀</div>
        <h1 class="text-4xl font-extrabold gradient-text mb-3">Create New Workspace</h1>
        <p class="text-gray-600 text-lg">Start collaborating with your team</p>
    </div>
    
    <form method="POST" class="bg-gradient-to-br from-white to-indigo-50 rounded-2xl shadow-2xl p-8 border-4 border-indigo-200 animate-fadeInUp">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
        <div class="mb-6">
            <label for="name" class="block text-sm font-bold text-gray-800 mb-3 flex items-center">
                <i class="fas fa-building mr-2 text-indigo-600"></i>
                Workspace Name <span class="text-red-500 ml-1">*</span>
            </label>
            <input type="text" name="name" id="name" required
                   class="w-full px-5 py-4 border-2 border-indigo-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 text-lg transition">
        </div>
        
        <div class="flex space-x-4 mt-8">
            <button type="submit" class="flex-1 bg-gradient-to-r from-indigo-600 to-purple-600 text-white px-8 py-4 rounded-xl hover:shadow-xl transform hover:scale-105 transition font-bold text-lg">
                <i class="fas fa-plus mr-2"></i> Create Workspace
            </button>
            <a href="{{ url_for('workspaces.dashboard') }}" class="bg-gradient-to-r from-gray-300 to-gray-400 text-gray-700 px-8 py-4 rounded-xl hover:shadow-lg transform hover:scale-105 transition font-semibold">
                Cancel
            </a>
        </div>
    </form>
</div>
{% endblock %}
